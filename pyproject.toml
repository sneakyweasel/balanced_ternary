[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balanced-ternary-prime"
version = "0.1.0"
description = "Balanced Ternary Mathematical Laboratory: core BT mathematics and independent research modules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Balanced Ternary Prime Language Explorer" }]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ui = ["streamlit>=1.62", "pandas>=2"]
experiments = ["pyarrow>=14"]

[project.scripts]
btprime = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py311"
